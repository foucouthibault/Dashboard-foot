# Analyse SonarQube Cloud, lancée depuis la CI GitHub Actions
sonar.organization=foucouthibault
sonar.projectKey=foucouthibault_Dashboard-foot

sonar.sources=src
sonar.tests=src,e2e
sonar.test.inclusions=**/*.spec.ts,**/__tests__/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Types générés depuis openapi.json du backend (npm run api:types) : pas de code à analyser
sonar.exclusions=src/types/api.generated.ts
