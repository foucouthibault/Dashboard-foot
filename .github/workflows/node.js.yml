name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: Lint, types, tests unitaires et build
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        # Historique complet pour que SonarQube Cloud puisse attribuer les lignes (blame) et détecter le nouveau code
        fetch-depth: 0
    - name: Use Node.js 22.x
      uses: actions/setup-node@v7.0.0
      with:
        node-version: 22.x
        cache: 'npm'
    - run: npm ci
    - run: npm run lint:check
    - run: npm run test:coverage
    - run: npm run build
    # Ignoré quand le secret n'est pas disponible (PR depuis un fork, PR Dependabot)
    - name: Analyze with SonarQube Cloud
      if: env.SONAR_TOKEN != ''
      uses: SonarSource/sonarqube-scan-action@v8.3.0

  e2e:
    name: Tests E2E (Playwright)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.1
    - name: Use Node.js 22.x
      uses: actions/setup-node@v7.0.0
      with:
        node-version: 22.x
        cache: 'npm'
    - run: npm ci
    - run: npx playwright install --with-deps chromium
    - run: npm run build-only
    - run: npx playwright test --project=chromium
    - name: Upload Playwright report
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 7
